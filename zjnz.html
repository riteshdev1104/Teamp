<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.11.1/tsparticles.bundle.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      font-family: 'Poppins', sans-serif;
      height: 100%;
      background: #111;
      color: #fff;
      overflow: hidden;
    }
    #tsparticles {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    .container {
      backdrop-filter: blur(15px);
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      margin: auto;
      margin-top: 10vh;
      max-width: 420px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 2.5rem;
      background: linear-gradient(90deg, #ff6a00, #ee0979);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    p {
      color: #ccc;
      margin-bottom: 25px;
    }
    .timer {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }
    .timer div {
      background: rgba(255,255,255,0.1);
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 1.1rem;
    }
    .socials {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .socials a {
      display: flex;
      align-items: center;
      gap: 8px;
      color: white;
      padding: 10px 16px;
      text-decoration: none;
      border-radius: 25px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      transition: 0.3s ease;
    }
    .socials a:hover {
      background: #fff;
      color: #111;
    }
    .footer-text {
      font-size: 0.9rem;
      margin-top: 30px;
      opacity: 0.7;
    }
    .toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.2);
      border: none;
      padding: 10px 15px;
      border-radius: 20px;
      color: white;
      cursor: pointer;
    }
    .light {
      background: #f0f0f0;
      color: #111;
    }
    .light .container {
      background: rgba(0, 0, 0, 0.05);
      color: #111;
    }
    .light h1 {
      background: linear-gradient(90deg, #111, #444);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .light .socials a {
      color: #111;
      background: rgba(0,0,0,0.1);
      border: 1px solid rgba(0,0,0,0.2);
    }
    svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <div id="tsparticles"></div>

  <button class="toggle" onclick="toggleTheme()">Toggle Mode</button>

  <div class="container">
    <h1>Coming Soon</h1>
    <p>Something amazing is launching soon. Stay tuned!</p>
    <div class="timer">
      <div><span id="days">00</span> Days</div>
      <div><span id="hours">00</span> Hrs</div>
      <div><span id="minutes">00</span> Min</div>
      <div><span id="seconds">00</span> Sec</div>
    </div>

    <div class="footer-text">Developers | Follow Us</div>
    <div class="socials">
      <a href="https://instagram.com/_.ritesh.0_0" target="_blank">
        <svg viewBox="0 0 24 24"><path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9A5.5 5.5 0 0 1 16.5 22h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2Zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9Zm9.75 1.75a.75.75 0 1 1 0 1.5.75.75 0 0 1 0-1.5ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg>
        @_.ritesh.0_0
      </a>
      <a href="https://instagram.com/tanishka.09_4" target="_blank">
        <svg viewBox="0 0 24 24"><path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9A5.5 5.5 0 0 1 16.5 22h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2Zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9Zm9.75 1.75a.75.75 0 1 1 0 1.5.75.75 0 0 1 0-1.5ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg>
        @tanishka.09_4
      </a>
      <a href="https://youtube.com/@Mister_Ritesh01" target="_blank">
        <svg viewBox="0 0 24 24"><path d="M10 15.5 15.19 12 10 8.5v7Zm12-7.22v7.44c0 2.27-1.84 4.12-4.12 4.12H6.12A4.13 4.13 0 0 1 2 15.72V8.28A4.13 4.13 0 0 1 6.12 4.16h11.76A4.13 4.13 0 0 1 22 8.28Z"/></svg>
        Mister_Ritesh01
      </a>
    </div>
  </div>

  <script>
    // Countdown for 2 months from now
    const now = new Date();
    const futureDate = new Date(now.setMonth(now.getMonth() + 2));
    function updateTimer() {
      const now = new Date().getTime();
      const distance = futureDate - now;
      document.getElementById("days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24));
      document.getElementById("hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      document.getElementById("minutes").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      document.getElementById("seconds").innerText = Math.floor((distance % (1000 * 60)) / 1000);
    }
    setInterval(updateTimer, 1000);
    updateTimer();

    function toggleTheme() {
      document.body.classList.toggle("light");
    }

    tsParticles.load("tsparticles", {
      fullScreen: { enable: false },
      background: { color: { value: "transparent" } },
      particles: {
        number: { value: 40 },
        size: { value: 3 },
        move: { enable: true, speed: 1 },
        opacity: { value: 0.3 },
        links: { enable: true, color: "#ffffff", distance: 100, opacity: 0.2 }
      }
    });
  </script>
</body>
</html>
